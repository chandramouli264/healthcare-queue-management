services:
  postgres:
    image: postgres:16-alpine
    container_name: hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hq
      POSTGRES_PASSWORD: hq_password
      POSTGRES_DB: healthcare_queue
    ports:
      - "5432:5432"
    volumes:
      - hq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq -d healthcare_queue"]
      interval: 5s
      retries: 10

volumes:
  hq_pgdata:
